<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="EchoLens 观响">
  <style>
    .paper { fill: #f5ecd7; }
    .ink   { fill: #1f1b16; }
    .ring  { fill: none; stroke: #1f1b16; stroke-width: 3.2; }
    .dot   { fill: #a23a22; }
    @media (prefers-color-scheme: dark) {
      .paper { fill: #1f1b16; }
      .ink   { fill: #f5ecd7; }
      .ring  { stroke: #f5ecd7; }
      .dot   { fill: #d27a5c; }
    }
  </style>

  <!-- 圆角纸色底 -->
  <rect class="paper" x="0" y="0" width="64" height="64" rx="14" ry="14" />

  <!-- 透镜 / 涟漪：三条同心圆，传达 Lens + Echo -->
  <circle class="ring" cx="32" cy="32" r="22" />
  <circle class="ring" cx="32" cy="32" r="14" />
  <circle class="ring" cx="32" cy="32" r="6" />

  <!-- 中心点：朱砂色小圆，回响的"点" -->
  <circle class="dot" cx="32" cy="32" r="2.4" />
</svg>
